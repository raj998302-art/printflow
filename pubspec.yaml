name: printflow
description: "PrintFlow — Batch Print Queue Manager for ESKAY PRINTERS. Strictly-serial PDF batch printing with real completion verification."
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  file_picker: ^8.0.7
  desktop_drop: ^0.4.4
  pdfrx: ^2.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3+2
  # Bundles the native sqlite3.dll for Windows/macOS/Linux desktop. Without
  # this, sqflite_common_ffi cannot load the sqlite3 native library on a fresh
  # Windows PC, so every database call fails — the app shows blank/error screens
  # and persistence (Module 10) is silently broken.
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
